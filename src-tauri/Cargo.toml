[package]
name = "dsh-box"
version = "1.1.0"
description = "DeepSeek Harness (dsh) desktop shell"
license-file = "../LICENSE"
authors = ["JeffioZ <13286072+JeffioZ@users.noreply.github.com>"]
edition = "2021"
# 受 ureq 3 / sha2 0.11 / getrandom 0.4 约束（三者均要求 1.85）
rust-version = "1.85"

[[bin]]
name = "DSHBox"
path = "src/main.rs"

[lib]
name = "dsh_box_lib"
# 纯桌面应用，无需移动端的静态库/动态库产物
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 启用 Tauri 不稳定 API（子 webview 自绘标题栏）；跨 crate feature cfg 要求应用侧同名声明
default = ["unstable"]
unstable = []

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 粘贴的模型配置属于不可信输入：只启用反序列化，利用默认重复键拒绝与解析预算。
serde-saphyr = { version = "1.1.0", default-features = false, features = ["deserialize"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Time",
  "Win32_Graphics_Gdi",
  # 供 windows-sys 内部门控：CreateJobObjectW 需要该 feature 才会编译
  "Win32_Security",
  # 供 windows-sys 内部门控：SHGetFileInfoW 需要该 feature 才会编译
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  # 供 RtlGetVersion 使用（贴边浮层 Win11 版本门控）
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  # 供 GetDpiForWindow 使用（贴边浮层覆盖层 DPI 换算）
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # 供 DwmSetWindowAttribute 使用（Win11 系统圆角）
  "Win32_Graphics_Dwm",
] }
# 复用 Tauri 已使用的轻量库：平台数据目录、进程级协议令牌、下载校验与 SemVer。
dirs = "6"
getrandom = "0.4.3"
sha2 = "0.11.0"
semver = "1"
url = "2"
# 自定义协议 dshd:// 的请求/响应类型（与 tauri 内部同版本，类型必须一致）
http = "1"
# 图标 PNG 编码用（deflate）；miniz_oxide 纯 Rust 后端，不引入系统 zlib
flate2 = "1"
tauri-plugin-notification = "2"
# 仅解码方向读 dsh 会话日志；关默认 feature 裁掉 C 侧 legacy 旧格式（v0.1+）解码器
# 与字典构建器。zstd→zstd-safe→zstd-sys 三层依赖均 default-features = false，顶层即总开关。
zstd = { version = "0.13.3", default-features = false }

# TLS 后端按平台选择：Windows/macOS 走系统原生实现（schannel / Security.framework），
# 体积更小且证书使用系统信任库（企业代理/自定义 CA 场景更友好）；
# Linux 保持 rustls 静态链接——native-tls 在 Linux 动态链接 OpenSSL，
# 构建机与运行机的 major 版本不一致会导致启动失败，风险大于体积收益。
# 注意：ureq 的 native-tls 传输实现门控在名为 "native-tls" 的 feature 上；
# native-tls-no-default 只引入依赖不点亮 feature，运行期首次 https 请求会
# panic（panic=abort 直接闪退，实测回归）。必须使用完整 native-tls。
[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3.4.0", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json"] }

# 用量日聚合的非 Windows 本地时区（localtime_r 取 UTC 偏移）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 通知点击深链：tauri-plugin-notification 的 Rust API 不暴露点击回调，
# Windows 侧直接用其底层 toast 库挂 in-process on_activated（非 Windows
# 平台维持插件通知，点击行为交给系统默认）。版本与插件传递依赖锁定一致。
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"

[profile.release]
strip = true
# thin LTO：链接速度显著快于 fat（增量构建收益大），体积/性能差异极小
lto = "thin"
codegen-units = 1
# 无需栈回溯：体积更小、启动更快；本项目无 catch_unwind 依赖
panic = "abort"
# 全部 crate（含本项目）按体积优化（size-optimized），进一步压缩单 exe
opt-level = "z"
