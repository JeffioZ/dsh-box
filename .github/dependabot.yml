version: 2
updates:
  # GitHub Actions 自动升级：major 版本变化会提 PR（CI 全绿后再合并）。
  # minor/patch 由浮动 tag（如 @v7）自动跟随，无需 PR。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5

  # Rust 依赖自动升级。major 升级（如 tauri 2→3）通常需改代码，合并前先跑 CI。
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  # npm 依赖自动升级（当前仅 devDependencies @resvg/resvg-js，用于图标生成）。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
