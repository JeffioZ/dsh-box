name: build

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支/PR 的并发构建自动取消旧的，避免排队浪费
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            cross: ""
            timeout: 45
          # macos-14 为 Apple Silicon runner；x86_64 在其上交叉编译（不再依赖
          # 濒临退役、排队极慢的 macos-13 Intel runner）
          - os: macos-14
            name: macos-arm64
            target: aarch64-apple-darwin
            cross: x86_64-apple-darwin
            timeout: 90
          - os: ubuntu-latest
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            cross: ""
            timeout: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # 三平台全量编译昂贵（release + LTO），缓存 target 目录大幅提速
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Add Rust targets
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          if [ -n "${{ matrix.cross }}" ]; then rustup target add ${{ matrix.cross }}; fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Unit tests
        run: cargo test --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --lib

      - name: Clippy (warnings as errors)
        run: cargo clippy --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Release build
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Release build (cross arch)
        if: matrix.cross != '' && github.event_name != 'pull_request'
        run: cargo build --locked --release --target ${{ matrix.cross }} --manifest-path src-tauri/Cargo.toml

      - name: Upload artifact (native)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: DSHDesktop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/DSHDesktop
            src-tauri/target/${{ matrix.target }}/release/DSHDesktop.exe
          if-no-files-found: warn

      - name: Upload artifact (cross)
        if: matrix.cross != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: DSHDesktop-${{ matrix.cross }}
          path: |
            src-tauri/target/${{ matrix.cross }}/release/DSHDesktop
            src-tauri/target/${{ matrix.cross }}/release/DSHDesktop.exe
          if-no-files-found: warn
