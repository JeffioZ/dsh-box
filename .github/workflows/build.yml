name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 默认只读；只有 tag 发布 job 单独提升 contents: write。
permissions:
  contents: read

env:
  # 与 dsh 官方支持范围的最低稳定版本一致，避免 runner 自带 Node 漂移。
  NODE_VERSION: 22.19.0

# 同一分支/PR 的并发构建自动取消旧的，避免排队浪费；
# tag 发布不取消进行中的构建，重推 tag 不会打断已在跑的发布
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # 发布前置：格式检查与项目一致性（含六处版本号同步）都在这个单 job 跑一次
  # （cargo fmt 与平台无关）；此处只额外校验 tag 格式与 tag ↔ 项目版本一致性。
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Project consistency checks
        run: npm run check
      - name: Check release tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::发布 tag 必须使用严格的 vX.Y.Z 格式"
              exit 1
            fi
            cargo_ver=$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)
            if [ "${GITHUB_REF_NAME#v}" != "$cargo_ver" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与项目版本 $cargo_ver 不一致"
              exit 1
            fi
          fi

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            # 面向用户的产物名（去掉技术化的 Rust target triple）
            asset: windows-x64
            target: x86_64-pc-windows-msvc
            cross: ""
            timeout: 45
          # macos-14 为 Apple Silicon runner；x86_64 在其上交叉编译（不再依赖
          # 濒临退役、排队极慢的 macos-13 Intel runner）
          - os: macos-14
            name: macos-arm64
            asset: macos-arm64
            target: aarch64-apple-darwin
            cross: x86_64-apple-darwin
            cross-asset: macos-x64
            timeout: 90
          - os: ubuntu-latest
            name: linux-x64
            asset: linux-x64
            target: x86_64-unknown-linux-gnu
            cross: ""
            timeout: 45
          # GitHub 免费 ARM runner（dsh 官方亦支持 linux-arm64）
          - os: ubuntu-24.04-arm
            name: linux-arm64
            asset: linux-arm64
            target: aarch64-unknown-linux-gnu
            cross: ""
            timeout: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # 三平台全量编译昂贵（release + LTO），缓存 target 目录大幅提速
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Add Rust targets
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          if [ -n "${{ matrix.cross }}" ]; then rustup target add ${{ matrix.cross }}; fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Unit tests
        run: cargo test --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Clippy (warnings as errors)
        run: cargo clippy --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cross-architecture compile check
        if: matrix.cross != ''
        run: cargo check --locked --target ${{ matrix.cross }} --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Cross-architecture Clippy
        if: matrix.cross != ''
        run: cargo clippy --locked --target ${{ matrix.cross }} --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Release build
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --locked --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Release build (cross arch)
        if: matrix.cross != '' && startsWith(github.ref, 'refs/tags/')
        run: cargo build --locked --release --target ${{ matrix.cross }} --manifest-path src-tauri/Cargo.toml

      # 打包为 zip：一步解压得到可执行本体，Linux 双击解压无 .tar.gz 的两层中间态；
      # zip 在 Unix 上记录可执行位，下载解压后可直接运行。
      # 产物用面向用户的 asset 名（如 windows-x64 / linux-arm64），
      # 而非 Rust target triple。
      - name: Package artifact (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release"
          zip -q "DSHBox-${{ matrix.asset }}.zip" DSHBox
          mv "DSHBox-${{ matrix.asset }}.zip" "$GITHUB_WORKSPACE/"

      # macOS：用 tauri CLI 把已构建的二进制打包为 .app 并生成 dmg（tauri bundle 只打包
      # 不编译，复用上方 Release build 产物；--no-sign 显式跳过签名，产物未签名，
      # Gatekeeper 首次运行需手动放行）。dmg 默认名为 <productName>_<ver>_<arch>.dmg
      # 按 productName 的精确输出名匹配并重命名为统一 asset 名；
      # 未生成则显式报错，避免静默上传空产物。
      - name: Install JS toolchain (macOS bundle)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies (macOS bundle)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        run: npm ci

      - name: Bundle macOS apps (dmg)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd src-tauri
          ver=$(node -p "require('../package.json').version")
          for spec in "${{ matrix.target }}:${{ matrix.asset }}" "${{ matrix.cross }}:${{ matrix.cross-asset }}"; do
            t="${spec%%:*}"; a="${spec##*:}"
            [ -z "$t" ] && continue
            npx tauri bundle --no-sign --bundles dmg --target "$t"
            arch="${t%%-*}"
            # tauri 对 x86_64 target 的 dmg 后缀用 x64（macOS 惯例），非 target triple 原样
            [ "$arch" = "x86_64" ] && arch="x64"
            dmg="target/$t/release/bundle/dmg/DSHBox_${ver}_${arch}.dmg"
            [ -f "$dmg" ] || { echo "::error::dmg 未生成: $dmg"; exit 1; }
            mv "$dmg" "$GITHUB_WORKSPACE/DSHBox-$a.dmg"
          done

      - name: Rename Windows asset
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cp "src-tauri/target/${{ matrix.target }}/release/DSHBox.exe" "DSHBox-${{ matrix.asset }}.exe"

      - name: Upload artifact (native)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: DSHBox-${{ matrix.asset }}
          path: DSHBox-${{ matrix.asset }}.*
          if-no-files-found: error

      - name: Upload artifact (cross)
        if: matrix.cross != '' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: DSHBox-${{ matrix.cross-asset }}
          path: DSHBox-${{ matrix.cross-asset }}.*
          if-no-files-found: error

  # tag 触发（push v*）时：汇总五平台产物并自动发布 release。
  # 产物永远来自 CI、永远全平台、永远正确命名，杜绝手动传本地产物。
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: true

      # Windows 自更新依赖 GitHub 为 release asset 生成的 digest。发布时立即
      # 验收，避免元数据缺失直到用户点击更新才暴露。draft release 不能通过
      # `releases/tags/<tag>` 查询（draft 不暴露给该端点，返回 404），因此先
      # 在 release 列表里按 tag 找到（含 draft 的）release id，再用 id 查 asset。
      - name: Verify Windows updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_id=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id' | head -1)
          if [[ -z "$release_id" ]]; then
            echo "::error::未找到 tag ${{ github.ref_name }} 对应的 release"
            exit 1
          fi
          digest=$(gh api "repos/${{ github.repository }}/releases/$release_id" \
            --jq '.assets[] | select(.name == "DSHBox-windows-x64.exe") | .digest')
          if [[ ! "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Windows release asset 缺少有效 SHA-256 digest"
            exit 1
          fi
          echo "Windows updater digest verified: ${digest:0:15}…"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "${{ github.ref_name }}" --draft=false
