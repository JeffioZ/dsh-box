<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会话文件变更</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    :root {
      --bg: #1b1b22; --card: #22222b; --line: #2e2e3a;
      --text: #ececf1; --muted: #8b8b94;
      --blue: #4d6bfe; --red: #f85149; --green: #3fb950;
      --add-bg: rgba(63, 185, 80, .12); --del-bg: rgba(248, 81, 73, .12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      padding: 18px 20px; user-select: none;
    }
    .ptitle { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .psub { font-size: 11px; color: var(--muted); margin-bottom: 14px; word-break: break-all; }
    .pstatus { min-height: 20px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .pstatus.err { color: var(--red); }
    .pstatus.ok { color: var(--green); }
    .plist { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .pitem {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      overflow: hidden;
    }
    .pitem-head {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer;
    }
    .pitem-head:hover { background: rgba(255,255,255,.03); }
    .pitem-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .pitem-meta { font-size: 11px; color: var(--muted); flex: none; }
    .pitem-tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; flex: none; }
    .pitem-tag.ok { color: var(--green); background: var(--add-bg); }
    .pitem-tag.no { color: var(--muted); background: rgba(139,139,148,.12); }
    .pbtn {
      background: #2c2c36; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 3px 12px; font-size: 12px; cursor: pointer; flex: none;
    }
    .pbtn:hover { background: #363642; }
    .pbtn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .pbtn.primary:hover { background: #3a52c9; }
    .pbtn:disabled { opacity: .5; cursor: default; }
    .pdiff { display: none; border-top: 1px solid var(--line); padding: 8px 12px; flex-direction: column; gap: 8px; max-height: 320px; overflow: auto; }
    .pitem.open .pdiff { display: flex; }
    .dop { font-size: 12px; }
    .dop-label { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .dop-old, .dop-new {
      white-space: pre-wrap; word-break: break-all; padding: 4px 8px; border-radius: 6px;
      font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; line-height: 1.45;
    }
    .dop-old { background: var(--del-bg); color: #f0a0a0; }
    .dop-new { background: var(--add-bg); color: #a8d8b0; }
    .dop-arrow { color: var(--muted); font-size: 11px; padding: 2px 0; }
    .pempty { font-size: 12px; color: var(--muted); padding: 4px 2px; }
    .dshd-scroll::-webkit-scrollbar { width: 10px; }
    .dshd-scroll::-webkit-scrollbar-thumb { background: #3a3a46; border-radius: 5px; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f8fa; --card: #fff; --line: #e2e4ea;
        --text: #1b1b22; --muted: #6a6a76; --red: #b42318;
        --add-bg: rgba(63, 185, 80, .1); --del-bg: rgba(248, 81, 73, .08);
      }
      .pbtn { background: #f0f1f5; }
      .pbtn:hover { background: #e6e8ef; }
      .pitem-head:hover { background: rgba(0,0,0,.02); }
      .dop-old { color: #a04040; }
      .dop-new { color: #2e7d32; }
      .dshd-scroll::-webkit-scrollbar-thumb { background: #c8ccd4; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body class="dshd-scroll">
  <main>
    <h1 class="ptitle" data-i18n="sessionDiffTitle">会话文件变更</h1>
    <div id="sd-sub" class="psub"></div>
    <div id="sd-status" class="pstatus" role="status" aria-live="polite"></div>
    <ul id="sd-list" class="plist"></ul>
  </main>
  <script src="common.js"></script>
  <script src="session-diff.js"></script>
</body>
</html>
