<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="common.css" />
  <script src="common.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .body { flex: 1; padding: 14px 16px; overflow-y: auto; }
    .big { font-size: 22px; font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
    .big .cur { font-size: 11px; color: var(--dshd-text-dim); font-weight: 400; }
    .rows { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .rrow { display: flex; justify-content: space-between; gap: 14px; font-size: 12px; color: var(--dshd-text-dim); }
    .rrow b { font-weight: 500; color: var(--dshd-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .status { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--dshd-border); display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dshd-text-dim); }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; }
    .status .dot.warn { background: #d29922; }
    .status .dot.err { background: #f85149; }
    .status .upd { margin-left: auto; font-size: 11px; }
    .spin {
      display: inline-block; width: 12px; height: 12px; margin-right: 8px;
      border: 2px solid var(--dshd-hover); border-top-color: var(--dshd-accent);
      border-radius: 50%; vertical-align: -2px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .uprow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--dshd-border); }
    .uprow:last-child { border-bottom: none; }
    .uprow .info { flex: 1; min-width: 0; }
    .uprow .name { font-weight: 500; }
    .uprow .ver { font-size: 12px; color: var(--dshd-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg { margin-top: 10px; font-size: 12px; color: var(--dshd-text-dim); white-space: pre-wrap; word-break: break-all; }
    .about { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
    .about .nm { font-size: 15px; font-weight: 600; }
    .about .ver-row { font-size: 12px; color: var(--dshd-text-dim); margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .about .cp { font-size: 11px; color: var(--dshd-text-dim); margin-top: 10px; opacity: .7; }
  </style>
</head>
<body class="dshd-body dshd-card">
  <div class="dshd-head"><span class="title" id="title">…</span><button class="dshd-x" id="btn-x" title="关闭">&#xE8BB;</button></div>
  <div class="body" id="body"></div>
  <div class="dshd-foot" id="foot"></div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    let openKind = '';
    const esc = dshdEsc;
    const $ = (id) => document.getElementById(id);
    const cur = (c) => esc(dshdCurrency(c)) + ' ';

    function foot(primaryLabel) {
      $('foot').innerHTML = '<button class="dshd-btn primary" id="b-close">' + esc(primaryLabel) + '</button>';
      document.getElementById('b-close').addEventListener('click', close);
    }

    // —— 余额 ——
    function renderBalance(data) {
      const body = $('body');
      if (!data) {
        body.innerHTML = '<div class="msg"><span class="spin"></span>正在查询余额…</div>';
        $('foot').innerHTML = '';
        return;
      }
      if (!data.ok || !data.balances || !data.balances.length) {
        body.innerHTML = '<div class="msg">' + esc((data && data.error) || '查询失败，请稍后重试') + '</div>';
        foot('关闭');
        return;
      }
      const b = data.balances[0];
      const fmt = (v) => esc(dshdBalanceValue(v));
      const granted = parseFloat(b.granted_balance || '0') || 0;
      let rows = '';
      if (granted > 0) {
        rows = '<div class="rows">' +
          '<div class="rrow"><span>已充值</span><b>' + cur(b.currency) + fmt(b.topped_up_balance) + '</b></div>' +
          '<div class="rrow"><span>赠送</span><b>' + cur(b.currency) + fmt(b.granted_balance) + '</b></div>' +
          '</div>';
      }
      const upd = data.updated_at
        ? '<span class="upd">更新于 ' + new Date(data.updated_at * 1000).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) + '</span>'
        : '';
      const dot = data.is_available ? '' : ' warn';
      const st = data.is_available ? '账户可用' : '账户不可用';
      body.innerHTML =
        '<div class="big">' + cur(b.currency) + fmt(b.total_balance) +
        '<span class="cur">' + esc(b.currency) + '</span></div>' + rows +
        '<div class="status"><span class="dot' + dot + '"></span>' + st + upd + '</div>';
      foot('关闭');
    }

    // —— 检查更新 ——
    function renderCheckLoading() {
      $('body').innerHTML = '<div class="msg"><span class="spin"></span>正在检查更新…</div>';
      $('foot').innerHTML = '<button class="dshd-btn" id="b-close">取消</button>';
      document.getElementById('b-close').addEventListener('click', close);
    }
    function updBtn(id, label, which, primary) {
      const btn = document.createElement('button');
      btn.className = 'dshd-btn' + (primary ? ' primary' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        btn.disabled = true;
        btn.textContent = '处理中…';
        invoke('app_dialog_update', { which }).catch(() => {});
      });
      document.getElementById(id).append(btn);
    }
    function renderCheckResult(r) {
      if (openKind !== 'check') return;
      const body = $('body');
      let html = '';
      if (r.dsh) {
        html += '<div class="uprow"><div class="info"><div class="name">dsh</div>' +
          '<div class="ver">' + esc(r.dsh.installed) + (r.dsh.update_available ? ' → ' + esc(r.dsh.latest) : '（已是最新）') + '</div></div>' +
          '<span id="u-dsh"></span></div>';
      }
      if (r.node) {
        const v = r.node.installed || '未检测到';
        const label = r.node.installed ? '已是最新' : '未安装';
        html += '<div class="uprow"><div class="info"><div class="name">Node.js</div>' +
          '<div class="ver">' + esc(v) + (r.node.update_available
            ? ' → ' + esc(r.node.latest_lts || '最新版')
            : '（' + label + '）') + '</div></div>' +
          '<span id="u-node"></span></div>';
      }
      if (r.pwsh) {
        const v = r.pwsh.installed || '未安装';
        html += '<div class="uprow"><div class="info"><div class="name">PowerShell 7</div>' +
          '<div class="ver">' + esc(v) + (r.pwsh.update_available
            ? ' → ' + esc(r.pwsh.latest || '最新版')
            : (r.pwsh.installed ? '（已是最新）' : '（未安装）')) + '</div></div>' +
          '<span id="u-pwsh"></span></div>';
      }
      if (r.error) html += '<div class="msg">' + esc(r.error) + '</div>';
      if (!r.dsh && !r.node && !r.pwsh) html += '<div class="msg">检查失败，请稍后重试</div>';
      body.innerHTML = html;
      if (r.dsh && r.dsh.update_available) updBtn('u-dsh', '更新', 'dsh', true);
      if (r.node && r.node.update_available) updBtn('u-node', r.node.installed ? '更新' : '安装', 'node', false);
      if (r.pwsh && r.pwsh.update_available) updBtn('u-pwsh', r.pwsh.installed ? '更新' : '安装', 'pwsh', false);
      const any = (r.dsh && r.dsh.update_available) || (r.node && r.node.update_available) || (r.pwsh && r.pwsh.update_available);
      foot(any ? '关闭' : '全部已是最新');
    }
    let lastProgress = '';
    function renderProgress(message) {
      if (openKind !== 'check') return;
      if (!message || message === '正在检查更新…' || message === lastProgress) return;
      lastProgress = message;
      const body = $('body');
      const line = body.querySelector('.msg');
      if (line) { line.textContent = message; return; }
      const div = document.createElement('div');
      div.className = 'msg';
      div.textContent = message;
      body.append(div);
    }
    function renderUpdateDone(p) {
      if (openKind !== 'check') return;
      const body = $('body');
      const line = body.querySelector('.msg');
      const text = (p.ok ? '✔ ' : '✖ ') + p.message;
      if (line) line.textContent = text;
      else {
        const div = document.createElement('div');
        div.className = 'msg';
        div.textContent = text;
        body.append(div);
      }
    }

    // —— 关于 ——
    const ABOUT_LOGO =
      '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">' +
      '<rect x="0" y="0" width="64" height="64" rx="14.08" fill="#4D6BFE"/>' +
      '<g transform="translate(12.16 12.16) scale(0.7936)">' +
      '<path d="M48.8354 10.0479C48.3232 9.79199 48.1025 10.2798 47.8032 10.5278C47.7007 10.6079 47.6143 10.7119 47.5273 10.8076C46.7793 11.624 45.9048 12.1597 44.7622 12.0957C43.0923 12 41.666 12.5356 40.4058 13.8398C40.1377 12.2319 39.2476 11.272 37.8926 10.6558C37.1836 10.3359 36.4668 10.0156 35.9702 9.31982C35.6235 8.82373 35.5293 8.27197 35.356 7.72754C35.2456 7.3999 35.1353 7.06396 34.7651 7.00781C34.3633 6.94385 34.2056 7.2876 34.0479 7.57568C33.418 8.75195 33.1733 10.0479 33.1973 11.3599C33.2524 14.312 34.4736 16.6641 36.8999 18.3359C37.1758 18.5278 37.2466 18.7197 37.1597 19C36.9946 19.5757 36.7974 20.1357 36.624 20.7119C36.5137 21.0801 36.3486 21.1597 35.9624 21C34.6309 20.4321 33.481 19.5918 32.4644 18.5757C30.7393 16.8721 29.1792 14.9917 27.2334 13.52C26.7764 13.1758 26.3193 12.856 25.8467 12.5518C23.8618 10.584 26.1069 8.96777 26.627 8.77588C27.1704 8.57568 26.8159 7.8877 25.0591 7.896C23.3022 7.90381 21.6953 8.50391 19.647 9.30371C19.3477 9.42383 19.0322 9.51172 18.7095 9.58398C16.8501 9.22363 14.9199 9.14355 12.9033 9.37598C9.10596 9.80762 6.07275 11.6396 3.84326 14.7681C1.16455 18.5278 0.53418 22.7998 1.30664 27.2559C2.11768 31.9521 4.46582 35.8398 8.07373 38.8799C11.8159 42.0322 16.1255 43.5762 21.041 43.2803C24.0269 43.104 27.3516 42.6963 31.1016 39.4561C32.0469 39.936 33.0396 40.1279 34.686 40.272C35.9546 40.3921 37.1758 40.208 38.1211 40.0078C39.6021 39.688 39.4995 38.2881 38.9639 38.0322C34.623 35.9678 35.5762 36.8081 34.71 36.1279C36.9155 33.4639 40.2402 30.6958 41.54 21.728C41.6426 21.0161 41.5557 20.5679 41.54 19.9917C41.5322 19.6396 41.6108 19.5039 42.0049 19.4639C43.0923 19.3359 44.1479 19.0317 45.1167 18.4878C47.9292 16.9199 49.064 14.3438 49.3315 11.2559C49.3711 10.7837 49.3237 10.2959 48.8354 10.0479ZM24.3262 37.8398C20.1196 34.4639 18.0791 33.3521 17.2358 33.3999C16.4482 33.4482 16.5898 34.3682 16.7632 34.9678C16.9443 35.5601 17.1812 35.9683 17.5117 36.4878C17.7402 36.832 17.8979 37.3442 17.2832 37.728C15.9282 38.584 13.5728 37.4399 13.       '</g>' +
      '</svg>';
    function renderAbout(initial) {
      $('body').innerHTML =
        '<div class="about">' +
        ABOUT_LOGO +
        '<div class="nm">DeepSeek Harness Desktop</div>' +
        '<div class="ver-row">' +
        '<span>应用版本 ' + esc(initial.app_version) + '</span>' +
        '<span>dsh ' + esc(initial.dsh_version) + '</span>' +
        '</div>' +
        '<div class="cp">© 2026 JeffioZ</div>' +
        '</div>';
      foot('关闭');
    }

    function close() {
      invoke('app_dialog_close').catch(() => {});
    }

    let lastOpenKey = '';
    function applyOpen(p) {
      if (!p) return;
      // 载荷印章去重：一次打开会被多条通道触发（eval / emit / 可见性变化），
      // 只渲染一次，避免重复重建 DOM 与重复动效
      const key = JSON.stringify(p);
      if (key === lastOpenKey) return;
      lastOpenKey = key;
      openKind = p.kind;
      $('title').textContent = p.title;
      if (p.kind === 'balance') renderBalance(p.initial);
      else if (p.kind === 'check') { lastProgress = ''; renderCheckLoading(); }
      else if (p.kind === 'about') renderAbout(p.initial);
    }
    // Rust 在隐藏状态下同步直呼（载荷内联）：show 前就渲染好本次内容，
    // 第一帧即正确内容，无上一弹窗残影
    window.__dshdOpen = applyOpen;
    // Rust 在关闭时直呼：清空内容并复位印章。空卡片会保持可见一帧后被
    // 隐藏（隐藏窗口不绘制），该帧成为下次打开前的第一帧——不再闪上一弹窗残影。
    // 印章复位也保证：再次打开时即使载荷与上次完全相同也会重新渲染
    window.__dshdReset = () => {
      lastOpenKey = '';
      openKind = '';
      balanceStamp = '';
      checkStamp = '';
      $('title').textContent = '…';
      $('body').innerHTML = '';
      $('foot').innerHTML = '';
    };
    listen('app-dialog-open', (e) => applyOpen(e.payload));
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        try { applyOpen(await invoke('app_dialog_get')); } catch (e) {}
      }
    });
    listen('app-dialog-balance', (e) => {
      if (openKind === 'balance') renderBalance(e.payload);
    });
    listen('update-result', (e) => {
      if (openKind === 'check') renderCheckResult(e.payload);
    });
    listen('update-progress', (e) => {
      if (e.payload && e.payload.message) renderProgress(e.payload.message);
    });
    // —— 轮询拉取（事件通道对该窗口不可靠，此为主通道）——
    let balanceStamp = '';
    let checkStamp = '';
    setInterval(async () => {
      try {
        if (openKind === 'balance') {
          const data = await invoke('app_dialog_balance_get');
          const key = JSON.stringify(data || null);
          if (key !== balanceStamp) {
            balanceStamp = key;
            renderBalance(data);
          }
        } else if (openKind === 'check') {
          const s = await invoke('app_dialog_check_get');
          const key = JSON.stringify(s);
          if (key !== checkStamp) {
            checkStamp = key;
            if (s && s.result) renderCheckResult(s.result);
            else if (s && s.progress) renderProgress(s.progress);
            if (s && s.done) renderUpdateDone(s.done);
          }
        }
      } catch (e) {}
    }, 600);

    $('btn-x').addEventListener('click', close);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
    });
  </script>
</body>
</html>
