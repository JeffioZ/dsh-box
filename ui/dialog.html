<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="common.css" />
  <script src="common.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    /* 不透明窗口（底色=卡片色），圆角由 Win11 系统裁剪，Win10 为直角 */
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; padding: 0; background: transparent; }
    /* 内层卡片：padding 覆盖为 0——头部/正文/页脚自带内边距，
       额外 4px 会在卡片边缘多一圈空档 */
    #card { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0; }

    /* 左侧导航 + 右侧内容 */
    #shell { flex: 1; min-height: 0; display: flex; }
    #nav {
      width: 152px; flex: none; display: flex; flex-direction: column; gap: 8px;
      padding: 12px 8px 8px; border-right: 1px solid var(--dshd-border); overflow-y: auto;
    }
    .nav-item {
      display: flex; align-items: center; gap: 9px; width: 100%; min-height: 40px;
      padding: 7px 10px; border: none; border-radius: 9px; background: transparent;
      color: var(--dshd-text-dim); font: inherit; font-size: 13px; line-height: 20px;
      cursor: pointer; text-align: left;
      transition: background-color var(--dshd-m-fast), color var(--dshd-m-fast);
    }
    .nav-item:hover { background: var(--dshd-hover); color: var(--dshd-text); }
    .nav-item:active { background: var(--dshd-pressed); }
    .nav-item:focus-visible { outline: 2px solid var(--dshd-accent); outline-offset: -2px; }
    .nav-item.active { background: var(--dshd-accent-surface); color: #fff; font-weight: 500; }
    .nav-item.active:hover { background: var(--dshd-accent-surface-hover); color: #fff; }
    .nav-item.active:active { background: var(--dshd-accent-surface-pressed); }
    .nav-item .nic {
      width: 24px; height: 24px; flex: none; display: inline-flex; align-items: center;
      justify-content: center; border-radius: 7px;
    }
    .nav-item .nav-label {
      min-width: 0; height: 24px; display: inline-flex; align-items: center; line-height: 20px;
    }
    .nav-item.active .nic { background: rgba(255, 255, 255, .16); }
    .nav-item svg { display: block; width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-ver { margin-top: auto; padding: 12px 10px 2px; font-size: 11px; color: var(--dshd-text-dim); opacity: .6; }
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    /* 内容居中容器：余额/关于等轻内容不撑满右侧，避免空旷 */
    .center-wrap { max-width: 420px; margin: 6px auto 0; width: 100%; }
    @media (prefers-reduced-motion: reduce) { .nav-item { transition: none; } }

    /* 展示/关闭微动效：窗口透明，内容淡入淡出在卡片上播放，
       不会露出 WebView 未绘制区域的白色；重放由 applyOpen 控制 */
    @keyframes dlg-pop-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dshd-pop-in { animation: dlg-pop-in var(--dshd-m-fast) ease-out; }
    /* 关闭比进入更快，仅做淡出；不下沉，避免窗口停住而内容位移的割裂感。 */
    body.fade-out { animation: none; opacity: 0; transition: opacity 90ms ease-in; }

    /* 余额刷新按钮（与标题栏浮层同款字形与节奏） */
    .dshd-refresh {
      flex: none; width: 28px; height: 28px; border: none; border-radius: 10px;
      background: transparent; color: var(--dshd-text-dim); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; outline: none;
      transition: background-color var(--dshd-m-fast) ease, color var(--dshd-m-fast) ease;
    }
    .dshd-refresh:hover { background: var(--dshd-hover); color: var(--dshd-text); }
    .dshd-refresh:focus-visible { outline: 2px solid var(--dshd-accent); outline-offset: -2px; }
    .dshd-refresh:active { background: var(--dshd-pressed); }
    .dshd-refresh svg {
      width: 14px; height: 14px; display: block;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .dshd-refresh.refreshing svg { animation: dlg-refresh-spin .8s linear infinite; }
    @keyframes dlg-refresh-spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    .body { flex: 1; min-height: 0; padding: 14px 18px; overflow-y: auto; }
    .bal-api {
      font-size: 11px; color: var(--dshd-text-dim); letter-spacing: .3px;
      margin-bottom: 6px; text-transform: uppercase;
    }
    .big {
      font-size: 24px; font-weight: 600; display: flex; align-items: baseline; gap: 6px;
      letter-spacing: -.2px; padding: 2px 0 10px; border-bottom: 1px solid var(--dshd-border);
    }
    .big .cur { font-size: 11px; color: var(--dshd-text-dim); font-weight: 400; }
    .balance-parts { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .balance-part { min-width: 0; padding: 7px 9px; border: 1px solid var(--dshd-border); border-radius: 9px; background: var(--dshd-hover); }
    .balance-part span { display: block; font-size: 11px; color: var(--dshd-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .balance-part b { display: block; margin-top: 1px; color: var(--dshd-text); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status { margin-top: 12px; padding-top: 10px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dshd-text-dim); }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dshd-success); }
    .status .dot.warn { background: var(--dshd-warning); }
    .status .dot.err { background: var(--dshd-error); }
    .status .upd { margin-left: auto; font-size: 11px; }
    .spin {
      display: inline-block; width: 12px; height: 12px; margin-right: 8px;
      border: 2px solid var(--dshd-hover); border-top-color: var(--dshd-accent);
      border-radius: 50%; vertical-align: -2px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .uprow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--dshd-border); }
    .uprow:last-child { border-bottom: none; }
    .uprow .info { flex: 1; min-width: 0; }
    .uprow .name { font-weight: 500; }
    .uprow .ver { font-size: 12px; color: var(--dshd-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-arrow { color: var(--dshd-text-dim); margin: 0 4px; font-size: 11px; }
    .v-latest { color: var(--dshd-success-text); font-weight: 600; margin-left: 2px; }
    .v-ok { color: var(--dshd-text-dim); font-size: 11px; margin-left: 6px; }
    .msg { margin-top: 10px; font-size: 12px; color: var(--dshd-text-dim); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    .msg.success { color: var(--dshd-success-text); }
    .msg.error { color: var(--dshd-error-text); }
    .about { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; max-width: 380px; margin: 4px auto 0; }
    .about .nm { font-size: 15px; font-weight: 600; }
    .about .tag { font-size: 12px; color: var(--dshd-text-dim); margin-top: -2px; }
    .about .ver-row { font-size: 12px; color: var(--dshd-text-dim); margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .about #about-check { margin-top: 4px; }
    .about .cp { font-size: 11px; color: var(--dshd-text-dim); margin-top: 10px; opacity: .7; }

    /* —— 插件管理（统一弹窗内） —— */
    .psearch { display: flex; gap: 8px; margin-bottom: 8px; position: relative; align-items: center; }
    .psearch-ic {
      position: absolute; left: 10px; width: 15px; height: 15px; color: var(--dshd-text-dim);
      pointer-events: none; display: inline-flex;
    }
    .psearch-ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .pinput {
      flex: 1; background: var(--dshd-hover); border: 1px solid var(--dshd-border);
      border-radius: 8px; padding: 7px 10px 7px 32px; color: var(--dshd-text); font-size: 13px; outline: none;
      transition: border-color var(--dshd-m-fast) ease;
    }
    .pinput:hover { border-color: var(--dshd-border-strong); }
    .pinput:focus { border-color: var(--dshd-accent); }
    .pinput:focus-visible { outline: 2px solid var(--dshd-accent); outline-offset: 1px; }
    .pcats { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .pcat-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 24px; line-height: 1; white-space: nowrap;
      background: transparent; color: var(--dshd-text-dim); border: 1px solid var(--dshd-border);
      border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer;
      transition: background-color var(--dshd-m-fast), color var(--dshd-m-fast), border-color var(--dshd-m-fast);
    }
    .pcat-btn:hover { color: var(--dshd-text); border-color: var(--dshd-text-dim); }
    .pcat-btn:active { background: var(--dshd-pressed); }
    .pcat-btn:focus-visible { outline: 2px solid var(--dshd-accent); outline-offset: 1px; }
    .pcat-btn.active { background: var(--dshd-accent-surface); border-color: var(--dshd-accent-surface); color: #fff; font-weight: 500; }
    .pcat-btn.active:hover { background: var(--dshd-accent-surface-hover); border-color: var(--dshd-accent-surface-hover); }
    .pcat-btn.active:active { background: var(--dshd-accent-surface-pressed); border-color: var(--dshd-accent-surface-pressed); }
    .pstatus { min-height: 18px; font-size: 12px; color: var(--dshd-text-dim); margin-bottom: 6px; }
    .pstatus.err { color: var(--dshd-error-text); }
    .pstatus.ok { color: var(--dshd-success-text); }
    @media (prefers-color-scheme: light) {
      .pstatus.err { color: var(--dshd-error-text); }
      .pstatus.ok { color: var(--dshd-success-text); }
    }
    .psection { margin-top: 10px; }
    .psection h3 { font-size: 12px; color: var(--dshd-text-dim); font-weight: 600; margin-bottom: 6px; letter-spacing: .2px; }
    /* —— 设置页开关行：整行可点、原生 checkbox+role=switch 语义、可见焦点环 —— */
    .srow {
      display: flex; align-items: center; gap: 12px;
      border: 1px solid var(--dshd-border); border-radius: 10px;
      padding: 10px 12px; background: var(--dshd-hover);
      cursor: pointer; min-height: 56px;
    }
    .srow + .srow { margin-top: 8px; }
    .srow:hover { border-color: var(--dshd-border-strong); }
    .srow-txt { flex: 1; min-width: 0; }
    .srow-name { display: block; font-size: 13px; font-weight: 500; }
    .srow-desc { display: block; margin-top: 2px; font-size: 12px; line-height: 18px; color: var(--dshd-text-dim); }
    .sswitch {
      appearance: none; -webkit-appearance: none; flex: none;
      width: 40px; height: 22px; border-radius: 999px; margin: 0;
      background: var(--dshd-pressed); border: 1px solid var(--dshd-border-strong);
      position: relative; cursor: pointer; outline: none;
      transition: background-color var(--dshd-m-fast) ease, border-color var(--dshd-m-fast) ease;
    }
    .sswitch::before {
      content: ""; position: absolute; left: 2px; top: 50%;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--dshd-text-dim);
      transform: translateY(-50%);
      transition: transform var(--dshd-m-fast) ease, background-color var(--dshd-m-fast) ease;
    }
    .sswitch:checked { background: var(--dshd-accent); border-color: var(--dshd-accent); }
    .sswitch:checked::before { transform: translate(18px, -50%); background: #fff; }
    .sswitch:focus-visible { outline: 2px solid var(--dshd-accent); outline-offset: 2px; }
    .sswitch:disabled { opacity: .55; cursor: default; }
    .srow:has(.sswitch:disabled) { opacity: .8; pointer-events: none; }
    .serr {
      margin-top: 10px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--dshd-border);
      background: rgba(224, 88, 76, .12); color: var(--dshd-error-text);
      font-size: 12px; line-height: 18px; overflow-wrap: anywhere;
    }
    @media (prefers-reduced-motion: reduce) {
      .sswitch, .sswitch::before { transition: none; }
    }
    .pcount { font-weight: 400; color: var(--dshd-text-dim); font-size: 11px; }
    .plist { list-style: none; display: flex; flex-direction: column; gap: 8px; padding: 0; margin: 0; }
    .pitem {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--dshd-border); border-radius: 10px; padding: 8px 12px;
      background: var(--dshd-hover);
    }
    .pitem .pmark {
      flex: none; width: 28px; height: 28px; border-radius: 8px;
      background: var(--dshd-pressed); color: var(--dshd-text);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; text-transform: uppercase;
    }
    .pitem .info { flex: 1; min-width: 0; }
    .pitem .name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pitem .desc { font-size: 12px; color: var(--dshd-text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pitem .ver { font-size: 11px; color: var(--dshd-text-dim); flex: none; }
    .pitem .pactions { display: flex; gap: 6px; flex: none; }
    /* 内置插件标签：中性低调，单行不换行（紧凑标签不折行规则） */
    .pitem .pbadge {
      display: inline-block; margin-left: 6px; padding: 1px 6px;
      font-size: 10px; line-height: 1.6; border-radius: 999px;
      background: var(--dshd-pressed); color: var(--dshd-text-dim);
      white-space: nowrap; vertical-align: middle; font-weight: 500;
    }
    .pempty { font-size: 12px; color: var(--dshd-text-dim); padding: 4px 2px; }
    /* 危险操作按钮（还原等）：语义危险色并与其他按钮分离 */
    .dshd-btn.danger {
      background: rgba(248, 81, 73, .14); color: var(--dshd-error-text);
      border-color: rgba(248, 81, 73, .4);
    }
    .dshd-btn.danger:hover { background: rgba(248, 81, 73, .24); border-color: rgba(248, 81, 73, .55); }
    .dshd-btn.danger:active { background: rgba(248, 81, 73, .34); border-color: rgba(248, 81, 73, .7); }
    .dshd-btn.danger:disabled:hover { background: rgba(248, 81, 73, .14); border-color: rgba(248, 81, 73, .4); }
    @media (prefers-color-scheme: light) {
      .dshd-btn.danger { background: rgba(180, 35, 24, .09); color: var(--dshd-error-text); border-color: rgba(180, 35, 24, .4); }
      .dshd-btn.danger:hover { background: rgba(180, 35, 24, .16); border-color: rgba(180, 35, 24, .55); }
      .dshd-btn.danger:active { background: rgba(180, 35, 24, .24); border-color: rgba(180, 35, 24, .7); }
      .dshd-btn.danger:disabled:hover { background: rgba(180, 35, 24, .09); border-color: rgba(180, 35, 24, .4); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dshd-btn, .pcat-btn { transition: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; }
      .dshd-pop-in { animation: none; }
      body.fade-out { transition: none; }
      .dshd-refresh.refreshing svg { animation: none; }
    }
    @media (prefers-color-scheme: light) {
      .msg.success { color: var(--dshd-success-text); }
      .msg.error { color: var(--dshd-error-text); }
    }
  </style>
</head>
<body class="dshd-body" role="dialog" aria-modal="true" aria-labelledby="title">
  <div id="card" class="dshd-card">
  <div class="dshd-head" data-tauri-drag-region="deep"><span class="title" id="title" data-trunc-tip>…</span><button type="button" class="dshd-refresh hidden" id="btn-refresh" data-i18n-title="refreshBalance" data-i18n-aria-label="refreshBalance"><svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"></path><path d="M21 3v5h-5"></path></svg></button><button type="button" class="dshd-x" id="btn-x" data-i18n-title="close" data-i18n-aria-label="close">&#xE8BB;</button></div>
  <div id="shell">
    <nav id="nav" aria-label=""></nav>
    <div id="main">
      <div class="body dshd-scroll" id="body"></div>
      <div class="dshd-foot" id="foot"></div>
    </div>
  </div>
  </div>
  <script>
    const tauri = window.__TAURI__;
    const invoke = tauri ? tauri.core.invoke : async () => null;
    const listen = tauri ? tauri.event.listen : async () => () => {};

    dshdApplyI18n();

    let openKind = '';
    let currentOpen = null;
    let lastBalanceData = null;
    let lastCheckResult = null;
    const esc = dshdEsc;
    const $ = (id) => document.getElementById(id);
    const cur = (c) => esc(dshdCurrency(c)) + ' ';

    // 仅为实际截断的元素设置 title（显示完整无额外信息则不出现悬停提示）；
    // data-tip-extra 提供"额外信息"提示（无论是否截断都显示，截断时
    // 截断的文本优先）。带 data-trunc-tip 的元素在每次渲染后调用
    function applyTruncationTips(root) {
      const scope = root || document;
      scope.querySelectorAll('[data-trunc-tip]').forEach((el) => {
        const truncated = el.scrollWidth > el.clientWidth + 1;
        const extra = el.dataset.tipExtra || '';
        el.title = truncated ? el.textContent.trim() : extra;
      });
    }

    function foot(primaryLabel) {
      $('foot').innerHTML = '<button type="button" class="dshd-btn primary" id="b-close">' + esc(primaryLabel) + '</button>';
      document.getElementById('b-close').addEventListener('click', close);
    }

    // —— 余额 ——
    function renderBalance(data) {
      // 轮询响应晚到时（期间已切换/关闭弹窗）不写已重置的 DOM
      if (openKind !== 'balance') return;
      lastBalanceData = data;
      const body = $('body');
      if (!data) {
        body.innerHTML = '<div class="msg" role="status" aria-live="polite"><span class="spin" aria-hidden="true"></span>' + dshdT('queryingBalance') + '</div>';
        $('foot').innerHTML = '';
        return;
      }
      if (!data.ok || !data.balances || !data.balances.length) {
        body.innerHTML = '<div class="msg error" role="alert">' + esc((data && data.error) || dshdT('balanceQueryFailed')) + '</div>';
        foot(dshdT('close'));
        return;
      }
      const b = data.balances[0];
      const fmt = (v) => esc(dshdBalanceValue(v));
      const parts = '<div class="balance-parts">' +
        '<div class="balance-part"><span data-trunc-tip>' + dshdT('toppedUpBalance') + '</span><b data-trunc-tip>' + cur(b.currency) + fmt(b.topped_up_balance) + '</b></div>' +
        '<div class="balance-part"><span data-trunc-tip>' + dshdT('grantedBalance') + '</span><b data-trunc-tip>' + cur(b.currency) + fmt(b.granted_balance) + '</b></div>' +
        '</div>';
      const upd = data.updated_at
        ? '<span class="upd">' + dshdT('updatedAt', { time: new Date(data.updated_at * 1000).toLocaleTimeString(dshdLocale(), { hour: '2-digit', minute: '2-digit' }) }) + '</span>'
        : '';
      const dot = data.is_available ? '' : ' warn';
      const st = data.is_available ? dshdT('accountAvailable') : dshdT('accountUnavailable');
      body.innerHTML =
        '<div class="center-wrap">' +
        '<div class="bal-api">DeepSeek API</div>' +
        '<div class="big">' + cur(b.currency) + fmt(b.total_balance) +
        '<span class="cur">' + esc(b.currency) + '</span></div>' + parts +
        '<div class="status"><span class="dot' + dot + '"></span>' + st + upd + '</div>' +
        '</div>';
      foot(dshdT('close'));
      applyTruncationTips($('body'));
    }

    // —— 检查更新 ——
    function renderCheckLoading(message) {
      $('body').innerHTML = '<div class="msg" role="status" aria-live="polite"><span class="spin" aria-hidden="true"></span>' + (message || dshdT('checkingUpdates')) + '</div>';
      $('foot').innerHTML = '<button type="button" class="dshd-btn" id="b-close">' + dshdT('close') + '</button>';
      document.getElementById('b-close').addEventListener('click', close);
    }
    function updBtn(id, label, which, primary) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dshd-btn' + (primary ? ' primary' : '');
      btn.textContent = label;
      btn.dataset.label = label;
      // 更新执行中重建结果行时，按钮保持禁用（UAC 确认期间同理）
      btn.disabled = updateRunning;
      btn.addEventListener('click', () => {
        updateRunning = true;
        document.querySelectorAll('.uprow .dshd-btn').forEach((button) => {
          button.disabled = true;
        });
        btn.textContent = dshdT('processing');
        invoke('app_dialog_update', { which }).catch((e) => {
          updateRunning = false;
          btn.disabled = false;
          btn.textContent = label;
          renderUpdateDone({ ok: false, message: dshdT('operationNotStarted', { message: e }) });
        });
      });
      document.getElementById(id).append(btn);
    }
    // 版本对比行：当前版本弱化 + 箭头 + 最新版本高亮（可更新时）
    function verHtml(cur, latest, available) {
      if (available) {

      body.querySelectorAll('.sswitch').forEach((el) => {

      invoke('settings_get').then(applySettingState).catch((e) => showSettingError(e));

    function applySettingState(state) {
      const body = $('body');
      SETTING_KEYS.forEach((key) => {
        const el = body.querySelector('.sswitch[data-key="' + key + '"]');
        if (el) el.checked = Boolean(state[key]);
      });
    }
    function showSettingError(message) {
      const err = $('serr');
      if (!err) return;
      err.textContent = message;
      err.hidden = false;
    }
    function hideSettingError() {
      const err = $('serr');
      if (err) err.hidden = true;
    }
    async function onSettingToggle(ev) {
      const input = ev.target;
      if (settingsBusy) {
        // 并发切换中：弹回（等待中的 invoke 返回后统一应用最新状态）
        input.checked = !input.checked;
        return;
      }
      settingsBusy = true;
      input.disabled = true;
      hideSettingError();
      try {
        const state = await invoke('settings_set', {
          key: input.dataset.key,
          value: input.checked,
        });
        applySettingState(state);
      } catch (e) {
        input.checked = !input.checked;
        showSettingError(dshdT('settingsFailed', { message: String(e) }));
      } finally {
        settingsBusy = false;
        input.disabled = false;

    async function doPluginUpdate(pkg) {

              renderedFresh = true;
            } else {
              // 转圈未满一圈：暂存新数据，待满圈后与停止动画一起应用——
              // 内容先更新、动画后停会显得“突然停下”（与浮层刷新节奏统一）
              pendingRefreshData = data;
            }
          }
          if (refreshing && Date.now() - balanceRefreshStart >= 900) {
            button.classList.remove('refreshing');
            if (pendingRefreshData) {
              if (!renderedFresh) {
                balanceStamp = JSON.stringify(pendingRefreshData);
                renderBalance(pendingRefreshData);
              }
              pendingRefreshData = null;
            }
          }
        } else if (openKind === 'check') {
          const s = await invoke('app_dialog_check_get');
          if (openKind !== 'check') return;
          const key = JSON.stringify(s);
          if (key !== checkStamp) {
            checkStamp = key;
            // 后端更新执行中：按钮全程保持禁用（结果行重建不再复活）
            if (s && s.updating) updateRunning = true;
            // UAC 确认等待期间不重建结果行（保持按钮禁用态）；
            // 结果未变化时不重复重建——进度每次更新只刷新文案行，
            // 被点按钮的“处理中…”文案得以保留
            if (s && s.result && !s.pwsh_pending) {
              const rk = JSON.stringify(s.result);
              if (rk !== lastResultKey) {
                lastResultKey = rk;
                renderCheckResult(s.result);
              }
            }
            // 进度独立于结果渲染：关闭重开后，进行中的更新进度经状态拉取
            if (s && s.progress) renderProgress(s.progress);
            if (s && s.done) renderUpdateDone(s.done);
          }
          // PowerShell UAC 预告：弹窗内展示并等待“继续”确认（kind 守卫：
          // 晚到响应不得把预告写到已重置的空白弹窗上）
          if (openKind === 'check' && s && s.pwsh_pending && !pwshPromptShown) {
            pwshPromptShown = true;
            const body = $('body');
            const div = document.createElement('div');
            div.className = 'msg';
            div.textContent = dshdT('pwshUacNotice');
            body.append(div);
            const footEl = $('foot');
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'dshd-btn primary';
            btn.textContent = dshdT('continue');
            btn.addEventListener('click', () => {
              btn.disabled = true;
              invoke('app_dialog_pwsh_confirm').catch(() => { btn.disabled = false; });
            });
            footEl.innerHTML = '';
            footEl.append(btn);
          }
        }
      } catch (e) {}
    }, 600);

    $('btn-x').addEventListener('click', close);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
    });
  </script>
</body>
</html>
