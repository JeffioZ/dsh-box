<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness Box</title>
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="common.css" />
  <style>
:root {
  --bg: var(--dshd-bg);
  --card: var(--dshd-card);
  --line: var(--dshd-border-strong);
  --text: var(--dshd-text);
  --muted: var(--dshd-text-dim);
  --blue: var(--dshd-accent);
  --blue-dim: var(--dshd-accent-hover);
  --blue-surface: var(--dshd-accent-surface);
  --blue-surface-hover: var(--dshd-accent-surface-hover);
  --blue-surface-pressed: var(--dshd-accent-surface-pressed);
  --red: var(--dshd-error-text);
  --green: var(--dshd-success);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, #1b1b26 0%, var(--bg) 60%);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
  user-select: none; overflow: hidden;
  /* 进入界面前的整体淡出：与 WebView 背景色衔接，避免导航瞬间白闪 */
  transition: opacity .3s ease;
}
/* 就绪后由 app.js 添加：内容淡出，露出与 dsh 界面一致的深色背景 */
body.fade-out { opacity: 0; }
.stage { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
.card { width: min(420px, 86vw); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.logo-wrap {
  width: 84px; height: 84px;
  display: flex; align-items: center; justify-content: center;
  /* 蓝底与圆角由 app-icon.svg 自身提供（与标题栏/关于弹窗同款完整图标）；
     此处仅作居中容器。不叠加动画/光晕：图标缩放与 box-shadow 沿圆角外扩
     会让圆角外泛色、视觉不干净 */
}
.logo {
  width: 84px; height: 84px;
}
.title { font-size: 22px; font-weight: 600; letter-spacing: .2px; margin-top: 6px; }
.tagline { font-size: 12px; color: var(--muted); letter-spacing: .4px; margin-top: 8px; }

.status { width: 100%; margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.status-line { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 14px; min-height: 20px; }
.status-detail { text-align: center; font-size: 12px; color: var(--muted); min-height: 16px; }
.bar { height: 4px; width: 100%; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; width: 12%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), #8aa2ff); transition: width .45s ease; animation: slide 1.4s linear infinite; }
.bar-fill.determinate { animation: none; }
.bar-fill.done { width: 100%; animation: none; }
.bar-fill.err { width: 100%; background: var(--red); animation: none; }
@keyframes slide { 0% { margin-left: -20%; } 100% { margin-left: 110%; } }

.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
/* 用 visibility 而非 display 隐藏：占位保留，就绪/失败切换时文字不跳动 */
.spinner.hidden { visibility: hidden; }
@keyframes spin { to { transform: rotate(360deg); } }

.error-box { width: 100%; background: rgba(248, 81, 73, .08); border: 1px solid rgba(248, 81, 73, .35); border-radius: 12px; padding: 14px; margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.error-box.reveal { animation: error-in .11s ease-out; }
@keyframes error-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.error-head { display: flex; align-items: center; gap: 8px; }
.error-icon { width: 18px; height: 18px; color: var(--red); flex: none; }
.error-title { font-size: 14px; font-weight: 600; color: var(--red); }
.error-title:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.error-hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
.error-msg { font-size: 12px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; max-height: 96px; overflow: auto; user-select: text; }
.error-actions { display: flex; gap: 8px; }
.update-box { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.update-line { font-size: 12px; color: var(--muted); }
.update-actions { display: flex; gap: 8px; }

.btn {
  background: #23232b; color: var(--text); border: 1px solid var(--line);
  border-radius: var(--dshd-r-md); padding: 7px 16px; font-size: 13px; cursor: pointer;
  transition: background var(--dshd-m-base), border-color var(--dshd-m-base);
}
.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn:hover { background: var(--dshd-hover); border-color: var(--dshd-border-strong); }
.btn:active { background: var(--dshd-pressed); }
.btn.primary { background: var(--blue-surface); border-color: var(--blue-surface); color: #fff; }
.btn.primary:hover { background: var(--blue-surface-hover); border-color: var(--blue-surface-hover); }
.btn.primary:active { background: var(--blue-surface-pressed); border-color: var(--blue-surface-pressed); }
.btn:disabled { cursor: default; opacity: .55; }
.btn:disabled:hover { background: #23232b; border-color: var(--line); }
.btn.primary:disabled:hover { background: var(--blue-surface); border-color: var(--blue-surface); }
.btn.small { padding: 4px 12px; font-size: 12px; }
.hidden { display: none !important; }

.footer { position: fixed; bottom: 18px; left: 0; right: 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 22px; font-size: 12px; color: var(--muted); }
.versions { opacity: .75; }

/* 首次使用配置：现代 onboarding 卡片——大内边距、分段控件、全宽主按钮 */
.ob-box {
  width: 100%;
  max-width: 480px;
  margin-top: 18px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 26px 28px;
  display: flex; flex-direction: column; gap: 20px;
  text-align: left;
  box-shadow: 0 8px 32px rgba(0, 0, 0, .28);
}
.ob-head { display: flex; flex-direction: column; gap: 6px; }
.ob-title { font-size: 20px; font-weight: 600; letter-spacing: .1px; }
.ob-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
.ob-section { display: flex; flex-direction: column; gap: 12px; }
.ob-sec-label { font-size: 11px; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; }
.ob-field { display: flex; flex-direction: column; gap: 7px; }
.ob-label { font-size: 13px; color: var(--muted); }
.ob-input {
  height: 38px; background: var(--dshd-hover); border: 1px solid var(--line);
  border-radius: 10px; padding: 0 12px; color: var(--text); font-size: 13px;
  outline: none; transition: border-color var(--dshd-m-fast) ease, box-shadow var(--dshd-m-fast) ease;
}
.ob-input:hover { border-color: var(--dshd-text-dim); background: var(--dshd-pressed); }
.ob-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(77, 107, 254, .18); }
.ob-hint { font-size: 11.5px; color: var(--muted); }
.ob-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ob-seg {
  display: inline-flex; background: var(--dshd-hover);
  border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px;
}
.ob-seg-opt { position: relative; cursor: pointer; user-select: none; }
.ob-seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
.ob-seg-opt span {
  display: block; padding: 5px 14px; border-radius: 7px; font-size: 12.5px;
  color: var(--muted); transition: background var(--dshd-m-fast) ease, color var(--dshd-m-fast) ease;
}
.ob-seg-opt:hover span { color: var(--text); }
.ob-seg-opt input:checked + span { background: var(--blue-surface); color: #fff; font-weight: 500; }
.ob-seg-opt input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.ob-switch { position: relative; width: 40px; height: 22px; flex: none; }
.ob-switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.ob-track {
  display: block; width: 100%; height: 100%; border-radius: 999px;
  background: var(--dshd-pressed); border: 1px solid var(--line);
  transition: background var(--dshd-m-fast) ease, border-color var(--dshd-m-fast) ease;
}
.ob-track::before {
  content: ""; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; border-radius: 50%; background: var(--muted);
  transition: transform var(--dshd-m-fast) ease, background var(--dshd-m-fast) ease;
}
.ob-switch input:checked + .ob-track { background: var(--blue); border-color: var(--blue); }
.ob-switch input:checked + .ob-track::before { transform: translate(18px, -50%); background: #fff; }
.ob-switch input:focus-visible + .ob-track { outline: 2px solid var(--blue); outline-offset: 2px; }
.ob-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.ob-primary { width: 100%; height: 38px; font-size: 14px; font-weight: 500; }
.ob-skip-btn {
  background: none; border: none; color: var(--muted); font-size: 12.5px;
  /* button 的 font 默认不继承 UA 样式（Arial + line-height normal），
     中英文行盒随字体变化（中文 fallback 行盒更高），导致切换语言时
     按钮高度差 5px、卡片整体位移；显式继承字体并固定行高使其一致 */
  font-family: inherit; line-height: 1.4;
  cursor: pointer; padding: 4px; align-self: center; border-radius: 6px;
  transition: color var(--dshd-m-fast) ease;
}
.ob-skip-btn:hover { color: var(--text); }
.ob-skip-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.ob-skip-btn:disabled { opacity: .55; cursor: default; }
.ob-error { font-size: 12.5px; color: var(--red); overflow-wrap: anywhere; line-height: 1.5; }
@media (prefers-color-scheme: light) {
  .ob-box { box-shadow: 0 8px 32px rgba(0, 0, 0, .08); }
  .ob-input { background: #fff; }
  .ob-input:focus { box-shadow: 0 0 0 3px rgba(77, 107, 254, .14); }
}
@media (prefers-reduced-motion: reduce) {
  .ob-seg-opt span, .ob-input, .ob-track, .ob-track::before, .ob-skip-btn { transition: none; }
}
/* 浅色系统主题适配（--dshd-* token 已自动切换；仅保留非 token 覆盖） */
@media (prefers-color-scheme: light) {
  body { background: radial-gradient(1200px 600px at 50% -10%, #e9edff 0%, var(--bg) 60%); }
  .btn { background: #f0f1f5; border-color: var(--line); color: var(--text); }
  .btn:hover { background: #e6e8ef; }
  .btn.primary { background: var(--blue-surface); border-color: var(--blue-surface); color: #fff; }
  .btn.primary:hover { background: var(--blue-surface-hover); border-color: var(--blue-surface-hover); }
  .error-box { background: rgba(248, 81, 73, .06); }
  .spinner { border-color: var(--line); border-top-color: var(--blue); }
}

/* 系统“减弱动态效果”：关闭全部动画 */
@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
  .spinner { animation: none; }
  .bar-fill { animation: none; transition: none; }
  .error-box.reveal { animation: none; }
}
</style>
</head>
<body>
  <main class="stage">
    <div class="card">
      <div class="logo-wrap" aria-hidden="true">
        <!-- 用 app-icon.svg（蓝底白鲸，固定 fill）：favicon.svg 的鲸鱼为
             fill="#000" 且仅媒体查询变白，而 <img> 内 SVG 是独立文档，
             外部 CSS 与 Tauri 窗口强制主题都不生效 → 黑鲸 -->
        <img class="logo" src="assets/app-icon.svg" alt="" />
      </div>
      <h1 class="title">DeepSeek Harness Box</h1>
      <p class="tagline" data-i18n="tagline">本地智能体 · 一键启航</p>

      <div id="ob-box" class="ob-box hidden">
        <div class="ob-head">
          <h2 class="ob-title" data-i18n="onboardingTitle">首次使用配置</h2>
          <p class="ob-sub" data-i18n="onboardingSub">配置 API Key、语言与主题，之后随时可改。</p>
        </div>
        <div class="ob-section">
          <div class="ob-sec-label">API</div>
          <label class="ob-field">
            <span class="ob-label">DeepSeek API Key</span>
            <input id="ob-apikey" class="ob-input" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
            <span class="ob-hint" data-i18n="apiKeyHint">留空则之后在 dsh 设置页配置</span>
          </label>
        </div>
        <div class="ob-section">
          <div class="ob-sec-label" data-i18n="preferences">偏好设置</div>
          <div class="ob-row">
            <span class="ob-label" data-i18n="language">语言</span>
            <div class="ob-seg" role="radiogroup" data-i18n-aria-label="language">
              <label class="ob-seg-opt"><input type="radio" name="ob-lang" value="zh-CN" checked /><span>中文</span></label>
              <label class="ob-seg-opt"><input type="radio" name="ob-lang" value="en" /><span>English</span></label>
            </div>
          </div>
          <div class="ob-row">
            <span class="ob-label" data-i18n="theme">主题</span>
            <div class="ob-seg" role="radiogroup" data-i18n-aria-label="theme">
              <label class="ob-seg-opt"><input type="radio" name="ob-theme" value="light" /><span data-i18n="themeLight">浅色</span></label>
              <label class="ob-seg-opt"><input type="radio" name="ob-theme" value="dark" /><span data-i18n="themeDark">深色</span></label>
              <label class="ob-seg-opt"><input type="radio" name="ob-theme" value="system" checked /><span data-i18n="themeSystem">跟随系统</span></label>
            </div>
          </div>
          <label class="ob-row ob-switch-row">
            <span class="ob-label" data-i18n="autostart">开机自启动</span>
            <span class="ob-switch">
              <input id="ob-autostart" type="checkbox" role="switch" />
              <span class="ob-track" aria-hidden="true"></span>
            </span>
          </label>
        </div>
        <div class="ob-actions">
          <button type="button" id="ob-start" class="btn primary ob-primary" data-i18n="startUsing">开始使用</button>
          <button type="button" id="ob-skip" class="ob-skip-btn" data-i18n="skip">跳过</button>
        </div>
        <div id="ob-error" class="ob-error hidden" role="alert" aria-live="polite"></div>
      </div>

      <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
        <div class="status-line">
          <span id="spinner" class="spinner" aria-hidden="true"></span>
          <span id="status-text" data-i18n="starting">正在启动…</span>
        </div>
        <div id="progress-bar" class="bar" role="progressbar" data-i18n-aria-label="startProgress" aria-valuemin="0" aria-valuemax="100"><div id="bar-fill" class="bar-fill"></div></div>
        <div id="status-detail" class="status-detail"></div>
      </div>

      <div id="error-box" class="error-box hidden" role="alert" aria-live="assertive" tabindex="-1">
        <div class="error-head">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <div class="error-title" data-i18n="startupFailed">启动失败</div>
        </div>
        <div class="error-hint" data-i18n="startupFailedHint">请重试；若持续失败，可打开日志查看详情。</div>
        <div id="error-msg" class="error-msg dshd-scroll"></div>
        <div class="error-actions">
          <button type="button" id="btn-retry" class="btn primary" data-i18n="retry">重试</button>
          <button type="button" id="btn-logs" class="btn" data-i18n="openLogs">打开日志</button>
          <button type="button" id="btn-quit" class="btn" data-i18n="quit">退出</button>
        </div>
      </div>

      <div id="update-box" class="update-box hidden">
        <div class="update-line"><span id="update-text" aria-live="polite" data-i18n="checkingUpdates">检查更新中…</span></div>
        <div class="update-actions">
          <button type="button" id="btn-update-check" class="btn small" data-i18n="checkUpdates">检查更新</button>
          <button type="button" id="btn-update-apply" class="btn small primary hidden" data-i18n="updateDsh">更新 dsh</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <span id="versions" class="versions"></span>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
