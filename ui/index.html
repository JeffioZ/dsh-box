<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness Box</title>
  <link rel="icon" href="assets/app-icon.svg" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="startup.css" />
</head>
<body>
  <main class="stage">
    <div class="card">
      <div class="logo-wrap" aria-hidden="true">
        <!-- 使用与窗口图标同源的 app-icon.svg，避免多份品牌资源漂移。 -->
        <img class="logo" src="assets/app-icon.svg" alt="" />
      </div>
      <h1 class="title">DeepSeek Harness Box</h1>
      <p class="tagline" data-i18n="tagline">本地智能体 · 一键启航</p>

      <div id="ob-box" class="ob-box hidden">
        <div class="ob-head">
          <h2 class="ob-title" data-i18n="onboardingTitle">首次使用配置</h2>
          <p class="ob-sub" data-i18n="onboardingSub">配置 API Key、语言与主题，之后随时可改。</p>
        </div>
        <div class="ob-section">
          <div class="ob-sec-label">API</div>
          <label class="ob-field">
            <span class="ob-label">DeepSeek API Key</span>
            <input id="ob-apikey" class="ob-input" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" aria-describedby="ob-apikey-hint ob-error" />
            <span id="ob-apikey-hint" class="ob-hint" data-i18n="apiKeyHint">留空则之后可在桌面端设置中配置</span>
          </label>
        </div>
        <div class="ob-section">
          <div class="ob-sec-label" data-i18n="preferences">偏好设置</div>
          <div class="ob-row">
            <span class="ob-label" data-i18n="language">语言</span>
            <div class="dshd-select" id="ob-lang">
              <button type="button" class="dshd-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="dshd-select-value">中文</span>
                <svg class="dshd-select-arrow" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
              <ul class="dshd-select-list" role="listbox" data-i18n-aria-label="language" hidden>
                <li role="option" data-value="zh-CN" aria-selected="true">中文</li>
                <li role="option" data-value="en" aria-selected="false">English</li>
              </ul>
            </div>
          </div>
          <div class="ob-row">
            <span class="ob-label" data-i18n="theme">主题</span>
            <div class="dshd-select" id="ob-theme">
              <button type="button" class="dshd-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="dshd-select-value">跟随系统</span>
                <svg class="dshd-select-arrow" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
              <ul class="dshd-select-list" role="listbox" data-i18n-aria-label="theme" hidden>
                <li role="option" data-value="light" aria-selected="false" data-i18n="themeLight">浅色</li>
                <li role="option" data-value="dark" aria-selected="false" data-i18n="themeDark">深色</li>
                <li role="option" data-value="system" aria-selected="true" data-i18n="themeSystem">跟随系统</li>
              </ul>
            </div>
          </div>
          <label class="ob-row ob-switch-row">
            <span class="ob-label" data-i18n="autostart">开机自启动</span>
            <span class="ob-switch">
              <input id="ob-autostart" type="checkbox" role="switch" />
              <span class="ob-track" aria-hidden="true"></span>
            </span>
          </label>
          <label class="ob-row ob-switch-row ob-consent-row">
            <span class="ob-option-copy">
              <span class="ob-label" data-i18n="builtinPluginsOptIn">安装推荐插件</span>
              <span class="ob-hint" data-i18n="builtinPluginsOptInDesc">自动安装 DSH Market 与 File Drop，并每日检查更新；可取消勾选。</span>
            </span>
            <span class="ob-switch">
              <input id="ob-builtin-plugins" type="checkbox" role="switch" checked />
              <span class="ob-track" aria-hidden="true"></span>
            </span>
          </label>
        </div>
        <div class="ob-actions">
          <button type="button" id="ob-start" class="btn primary ob-primary" data-i18n="startUsing">开始使用</button>
          <button type="button" id="ob-skip" class="ob-skip-btn" data-i18n="skip">跳过</button>
        </div>
        <div id="ob-error" class="ob-error hidden" role="alert" aria-live="polite"></div>
      </div>

      <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
        <div class="status-line">
          <span id="spinner" class="spinner" aria-hidden="true"></span>
          <span id="status-text" data-i18n="starting">正在启动…</span>
        </div>
        <div id="progress-bar" class="bar" role="progressbar" data-i18n-aria-label="startProgress" aria-valuemin="0" aria-valuemax="100"><div id="bar-fill" class="bar-fill"></div></div>
        <div id="status-detail" class="status-detail"></div>
        <div id="install-actions" class="install-actions hidden">
          <span class="install-source-label" data-i18n="installSource">下载源</span>
          <div class="install-source" role="group" data-i18n-aria-label="installSource">
            <button type="button" class="btn small source-choice" data-source="auto" data-i18n="installSourceAuto">自动</button>
            <button type="button" class="btn small source-choice" data-source="official" data-i18n="installSourceOfficial">官方</button>
            <button type="button" class="btn small source-choice" data-source="mirror" data-i18n="installSourceMirror">镜像</button>
          </div>
          <button type="button" id="btn-cancel-install" class="btn small" data-i18n="cancelInstall">取消安装</button>
        </div>
      </div>

      <div id="error-box" class="error-box hidden" role="alert" aria-live="assertive" tabindex="-1">
        <div class="error-head">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <div class="error-title" data-i18n="startupFailed">启动失败</div>
        </div>
        <div class="error-hint" data-i18n="startupFailedHint">请重试；若持续失败，可打开日志查看详情。</div>
        <div id="error-msg" class="error-msg dshd-scroll"></div>
        <div class="error-actions">
          <button type="button" id="btn-retry" class="btn primary" data-i18n="retry">重试</button>
          <button type="button" id="btn-logs" class="btn" data-i18n="openLogs">打开日志</button>
          <button type="button" id="btn-quit" class="btn" data-i18n="quit">退出</button>
        </div>
      </div>

      <div id="update-box" class="update-box hidden">
        <div class="update-line"><span id="update-text" aria-live="polite" data-i18n="checkingUpdates">检查更新中…</span></div>
        <div class="update-actions">
          <button type="button" id="btn-update-check" class="btn small" data-i18n="checkUpdates">检查更新</button>
          <button type="button" id="btn-update-apply" class="btn small primary hidden" data-i18n="updateDsh">更新 dsh</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <span id="versions" class="versions"></span>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="startup.js"></script>
</body>
</html>
