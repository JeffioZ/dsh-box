<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="common.css" />
  <style>
/* 底部状态栏：固定 26px 单行；会话统计（左）+ 余额 chip（右）。
   悬停说明使用系统默认 title，子 WebView 不再因 hover 扩缩。 */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #181819;
  color: var(--dshd-text);
  /* dsh 字体栈（dsw-font-family） */
  font-family: var(--dshd-font);
  user-select: none;
}
/* 窗口失焦：与标题栏一致整体变暗（class 由 Rust 侧 Focused 广播驱动）；
   分隔线一并压暗，避免窄条上失焦时竖线显得比内容更亮 */
body.window-inactive .stats { opacity: .55; }
body.window-inactive .sb-chip { opacity: .55; }
body.window-inactive .vsep { opacity: .55; }

.statusbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 8px 0 8px; background: #181819;
}
/* 与 dsh 内容的分层线：画在 26px 条内（box-shadow 落条外会被子 webview 裁剪） */
.statusbar::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
  background: var(--dshd-border);
}
/* —— 会话统计（点击打开详情；悬停说明由系统默认 title 提供） ——
   悬停几何与右侧余额 chip 同规格：通高、r-sm、8px 水平内距 */
.stats {
  min-width: 0; max-width: 100%; display: flex; align-items: center; gap: 0;
  height: 100%; padding: 0 8px; border-radius: var(--dshd-r-sm);
  font: inherit; font-size: var(--dshd-fs-sm); line-height: 1; white-space: nowrap; overflow: hidden;
  cursor: pointer; border: none; background: transparent; color: inherit; outline: none;
  transition: var(--dshd-anim-state);
}
.stats:hover { background: var(--dshd-hover); }
.stats:active { background: var(--dshd-pressed); }
.stats:focus-visible { outline: 2px solid var(--dshd-accent); outline-offset: -2px; }
.stats:disabled { cursor: default; background: transparent; opacity: .55; }
/* 统计组：图标（装饰性，dim 色）+ 数值文本（主色 + 500 字重） */
.stats .g { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.stats .g-ic { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--dshd-text-dim); }
.stats .g-t {
  color: var(--dshd-text); font-weight: 500;
  font-variant-numeric: tabular-nums;
}
/* 缓存命中组：success 色点缀（文字本身承载语义，颜色非唯一信号） */
.stats .g.cache .g-t { color: var(--dshd-success-text); }
/* 组间竖分隔线：1px 高 10px，与 dsh 分隔线色一致 */
.stats .vsep { flex: none; width: 1px; height: 10px; margin: 0 7px;
  background: var(--dshd-border-strong); }
/* 统计区与余额 chip 之间的常驻分隔线（余额是信息流的固定尾组） */
.statusbar > .vsep.edge { flex: none; width: 1px; height: 10px; margin: 0 6px;
  background: var(--dshd-border-strong); }
.flex-space { flex: 1; }

/* —— 余额 chip（点击打开详情；悬停说明由系统默认 title 提供） ——
   与左侧统计区同一悬停几何：通高 26px、r-sm、8px 水平内距——状态栏两个
   可点区域的 hover 药丸必须同规格（此前 chip 是 inset 2px 的小浮药丸，
   与统计区的通高 hover 尺寸/圆角都不一致） */
.sb-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 100%;
  color: var(--dshd-text); font: inherit;
  background: transparent; border: none; border-radius: var(--dshd-r-sm);
  padding: 0 8px; font-size: var(--dshd-fs-sm); line-height: 1; cursor: pointer; outline: none;
  font-variant-numeric: tabular-nums; font-weight: 500;
  transition: var(--dshd-anim-state);
}
.sb-chip:hover { background: var(--dshd-hover); }
.sb-chip:focus-visible { outline: 2px solid var(--dshd-accent); outline-offset: -2px; }
.sb-chip:active { background: var(--dshd-pressed); }
.sb-chip:disabled { cursor: default; opacity: .55; }
.sb-chip .c-ic { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--dshd-text-dim); }
.sb-chip .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--dshd-success); flex: none;
  /* 光学补偿：钱包图标墨迹右缘内缩 ~1.5px、金额字形左缘留白 ~0.5px，
     flex gap 均等时状态点视觉上偏右；左 1 / 右 2 补差让墨迹间隙对称 */
  margin: 0 2px 0 1px;
  /* 同色光晕（color-mix，WebView2 已在用量页使用）：状态点更醒目 */
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--dshd-success) 16%, transparent);
}
.sb-chip .dot.warn { background: var(--dshd-warning); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dshd-warning) 16%, transparent); }
.sb-chip .dot.err { background: var(--dshd-error); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dshd-error) 16%, transparent); }
.sb-chip .dot.neutral { background: var(--dshd-text-dim); box-shadow: none; }
/* 余额预警文字色：remaining/total 阈值驱动（悬停另有文字说明，不只靠颜色） */
.sb-chip.low-warning #balance-text { color: var(--dshd-warning); }
.sb-chip.low-critical #balance-text { color: var(--dshd-error-text); }

/* 浅色主题覆盖 */
@media (prefers-color-scheme: light) {
  body { background: #fcfcfd; }
  .statusbar { background: #fcfcfd; }
  .statusbar::before { background: rgba(0, 0, 0, .04); }
}
@media (prefers-reduced-motion: reduce) {
  .stats, .sb-chip { transition: none; }
}
  </style>
</head>
<body>
  <div class="statusbar">
    <button type="button" id="stats" class="stats" data-i18n-aria-label="statsRegion"></button>
    <div class="flex-space"></div>
    <span class="vsep edge" id="edge-sep" aria-hidden="true"></span>
    <button type="button" id="balance-chip" class="sb-chip"
            data-i18n-aria-label="balanceDetailsAria" data-i18n-title="balanceChipHint"></button>
  </div>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="statusbar.js"></script>
</body>
</html>
