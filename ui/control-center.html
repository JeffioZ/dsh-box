<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="common.css" />
  <script src="i18n.js"></script>
  <script src="edit-context.js"></script>
  <script src="common.js"></script>
  <script src="menu.js"></script>
  <link rel="stylesheet" href="control-center.css" />
</head>
<body class="dshd-body" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div id="card" class="dshd-card">
  <nav id="nav" data-i18n-aria-label="navLabel"></nav>
  <div id="main">
    <div class="dshd-head" data-tauri-drag-region="deep"><h1 class="title" id="dialog-title" tabindex="-1"></h1><button type="button" class="dshd-refresh hidden" id="btn-refresh" data-i18n-title="usageRefresh" data-i18n-aria-label="usageRefresh"><svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"></path><path d="M21 3v5h-5"></path></svg></button><button type="button" class="dshd-x" id="btn-x" data-i18n-title="close" data-i18n-aria-label="close"><svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
    <div class="body dshd-scroll" id="body"></div>
  </div>
  </div>
  <!-- 脚本顺序契约：settings/plugins 只定义函数，共享别名（esc/$/applyTruncationTips/
       dshChannelChanged/renderNav 等）由最后加载的 control-center.js 提供；
       三文件同属一个全局作用域，新增跨文件引用时必须保持该加载顺序。 -->
  <script src="control-center-settings.js"></script>
  <script src="control-center-plugins.js"></script>
  <script src="control-center.js"></script>
</body>
</html>
