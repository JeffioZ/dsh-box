<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="common.css" />
  <style>
    /* 与普通弹窗相同：透明宿主窗口只负责承载，卡片背景、圆角、阴影与
       动效均由内容层绘制。阴影余量须与 tray_menu.rs 的常量同步。 */
    html, body { height: 100%; overflow: hidden; }
    * { box-sizing: border-box; }
    body {
      display: flex; padding: 12px 16px 20px; background: transparent;
    }
    #card {
      flex: 1; min-width: 0; min-height: 0;
    }
    #list { display: flex; flex-direction: column; }
  </style>
</head>
<body class="dshd-body">
  <div id="card" class="dshd-card dshd-menu-surface dshd-menu-motion">
    <div id="list" role="menu" data-i18n-aria-label="appMenu"></div>
  </div>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="menu.js"></script>
  <script>
    dshdApplyI18n();
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const currentWindow = window.__TAURI__.window.getCurrentWindow();

    const card = document.getElementById('card');
    const menuMotion = dshdCreateMenuMotion(card);
    const menu = dshdCreateMenu(document.getElementById('list'), {
      onChoose: (id) => {
        // 与主菜单一致：动作立即分发，70ms 按压反馈后再开始关闭。
        invoke('menu_choose', { id }).catch(() => {});
        menuMotion.afterPress(() => {
          invoke('tray_menu_close').catch(() => currentWindow.hide());
        });
      },
      onEscape: () => invoke('tray_menu_close').catch(() => currentWindow.hide()),
    });

    function applyOpen(items, direction) {
      menu.setItems(items);
      if (document.activeElement && document.activeElement !== document.body) {
        document.activeElement.blur();
      }
      // 隐藏状态完成内容与初态准备；show 后下一绘制帧只改变 opacity/transform。
      // 快速重开会先取消旧帧，最终语义状态不依赖 transitionend。
      menuMotion.open(direction === 'down' ? '-3px' : '3px');
    }

    function applyClose() {
      menuMotion.close();
    }

    function resetSurface() {
      menuMotion.reset();
    }

    async function refresh() {
      try {
        menu.setItems(await invoke('menu_get', { traySurface: true }));
      } catch (e) {
        // IPC 不可用等致命失败：至少给出可见提示，而不是只剩窗口底色
        // （common.js 的 __TAURI__ 兜底已向控制台打印具体原因）
        const list = document.getElementById('list');
        if (list.children.length === 0) {
          const row = document.createElement('div');
          row.className = 'dshd-row';
          row.style.opacity = '0.55';
          row.style.cursor = 'default';
          row.textContent = dshdT('menuLoadFailed');
          list.append(row);
        }
      }
    }
    // Rust 在 show 前同步直呼：首帧即为正确内容与透明动画初态。
    window.__dshdOpen = applyOpen;
    window.__dshdClose = applyClose;
    window.__dshdReset = resetSurface;
    // 旧事件链与页面首次加载仍可刷新，作为 IPC/极早右键场景的兜底。
    window.__dshdRefresh = refresh;

    listen('tray-menu-open', (e) => menu.setItems(e.payload));
    window.addEventListener('focus', () => {
      if (document.getElementById('list').children.length === 0) refresh();
      else menu.focusFirst();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refresh();
    });
    window.addEventListener('dshd-language-changed', refresh);
    refresh();
  </script>
</body>
</html>
