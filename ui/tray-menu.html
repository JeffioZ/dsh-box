<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="common.css" />
  <style>
    /* 托盘菜单：不透明窗口（底色=卡片色），圆角由 Win11 系统裁剪
       （DWM 圆角属性），Win10 为直角；卡片无圆角/阴影自绘。
       展示/消失为原生菜单式即时切换：该窗口对可见性事件不可靠，
       入场/退场动效曾引发空白与抖动问题，故不做。
       hover 过渡与语言子菜单展开收起动效（纯 CSS，common.css）保留。 */
    html, body { height: 100%; overflow: hidden; }
    /* box-sizing 必须显式声明（border-box），卡片占满窗口；无阴影边距 */
    * { box-sizing: border-box; }
    body { padding: 0; background: transparent; }
    #list { display: flex; flex-direction: column; }
  </style>
</head>
<body class="dshd-body">
  <div class="dshd-card">
    <div id="list" role="menu" data-i18n-aria-label="appMenu"></div>
  </div>
  <script src="common.js"></script>
  <script src="menu.js"></script>
  <script>
    dshdApplyI18n();
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const currentWindow = window.__TAURI__.window.getCurrentWindow();

    const menu = dshdCreateMenu(document.getElementById('list'), {
      onChoose: (id) => invoke('menu_choose', { id }).catch(() => {}),
      onSubmenuChange: (id, expanded) =>
        invoke('tray_menu_set_submenu_expanded', { id, expanded }).catch(() => {}),
      onEscape: () => currentWindow.hide(),
    });

    async function refresh() {
      try {
        menu.setItems(await invoke('menu_get', { traySurface: true }));
      } catch (e) {
        // IPC 不可用等致命失败：至少给出可见提示，而不是只剩窗口底色
        // （common.js 的 __TAURI__ 兜底已向控制台打印具体原因）
        const list = document.getElementById('list');
        if (list.children.length === 0) {
          const row = document.createElement('div');
          row.className = 'dshd-row';
          row.style.opacity = '0.55';
          row.style.cursor = 'default';
          row.textContent = dshdT('menuLoadFailed');
          list.append(row);
        }
      }
    }
    // Rust 在窗口 show 后 eval 调用本函数：隐藏窗口收不到 emit 时的兜底
    window.__dshdRefresh = refresh;
    window.__dshdCollapseMenu = () => menu.collapseSubmenus(false);

    listen('tray-menu-open', (e) => menu.setItems(e.payload));
    window.addEventListener('focus', () => {
      if (document.getElementById('list').children.length === 0) refresh();
      else menu.focusFirst();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refresh();
    });
    window.addEventListener('dshd-language-changed', refresh);
    refresh();
  </script>
</body>
</html>
